<script>
(function () {
  'use strict';

  const BOOT = window.__ACADIA_BOOTSTRAP__ || {};
  const DEADLINE_NOTICE = 'Deadlines are reminders only. Uploading, saving, and submitting remain available after the displayed dates.';
  const CAMERA_READY_TASKS = ['feedback', 'metadata', 'camera_ready', 'consent', 'attendance', 'indexing'];
  const REQUIRED = CAMERA_READY_TASKS.concat(['registration']);
  const BOOK_FORUM_TASKS = ['registration', 'book_poster', 'book_proceeding'];
  const BOOK_FORUM_DEADLINE_DATE = "__ACADIA_TEXT_t0038__";
  const BOOK_FORUM_DEADLINE_LABEL = BOOK_FORUM_DEADLINE_DATE + ', 11:59 PM AoE';
  const TASK_INFO = {
    feedback: {
      number: '1', title: 'Reviewer feedback',
      subtitle: 'Read the reviewer comments assigned to this submission and confirm that the revised work responds to them.',
      description: 'Read the anonymous reviewer comments and record an optional revision summary.'
    },
    metadata: {
      number: '2', title: 'Authors, publication metadata, and website materials',
      subtitle: 'Enter the final publication record, unblinded abstract, and up to five conference-website images.',
      description: 'Final title, author order, affiliations, abstract, keywords, images, captions, credits, and alt text.'
    },
    phd_poster: {
      number: '2', title: 'PhD Workshop Exhibition Poster',
      subtitle: 'Download the official poster materials and upload one press-quality PhD Workshop exhibition poster PDF.',
      description: 'One exhibition poster PDF for the PhD Workshop.'
    },
    volunteer: {
      number: '6', title: 'Volunteer Service Preferences',
      subtitle: 'Select the conference volunteer roles you would be willing to support and all times when you are available.',
      description: 'Select one or more volunteer preferences and at least one availability slot. The organizing team will confirm the final assignment separately.'
    },
    camera_ready: {
      number: '3', title: 'Camera-ready publication package',
      subtitle: 'Download the template package and instructions, then upload one complete camera-ready ZIP.',
      description: 'One ZIP per accepted submission. Maximum file size: 1 GB.'
    },
    consent: {
      number: '4', title: 'Copyright and recording consent',
      subtitle: 'Download the consent PDF, sign it, rename it using the Paper ID, and upload the signed PDF.',
      description: 'The signed PDF filename must be the Paper ID, for example 319.pdf.'
    },
    attendance: {
      number: '5', title: 'Confirm your attendance',
      subtitle: "__ACADIA_TEXT_t0039__",
      description: 'Confirm attendance and provide the presenting author’s name and email.'
    },
    indexing: {
      number: '6', title: 'Indexing metadata',
      subtitle: 'Continue to the ACADIA indexing portal, enter the requested information, and confirm completion here.',
      description: 'The final title and author order must match the camera-ready submission.'
    },
    registration: {
      number: '7', title: 'Conference registration',
      subtitle: 'Purchase the required registration and upload the confirmation-page PDF.',
      description: 'A single registration may cover: one Full Paper + one Project/Field Note, OR one Project, OR one Field Note. It cannot cover Project + Project or Project + Field Note.'
    },
    book_poster: {
      number: '2', title: 'Book Forum Poster',
      subtitle: 'Download the official poster template and upload one press-quality Book Forum poster PDF.',
      description: 'One press-quality poster PDF prepared with the official ACADIA poster template.'
    },
    book_proceeding: {
      number: '3', title: 'Book Forum Proceedings Pages',
      subtitle: 'Download the proceedings template and upload the complete Book Forum Proceedings InDesign package as one ZIP.',
      description: 'One InDesign package ZIP prepared with the Book Forum Proceedings template. Maximum formatted length: four pages.'
    },
    presentation: {number: '8', title: 'Conference presentation', subtitle: 'Session details, PowerPoint slides, and prerecorded presentation videos.', description: 'Check your presentation date and upload deadline. Upload slides and, for remote presentations, a prerecorded video.'},
    author_proof: {
      number: 'P', title: 'Author proof',
      subtitle: 'Download the copyedited PDF, answer the copyeditor directly with PDF annotations, and upload the annotated PDF with any requested replacement files.',
      description: 'Download, annotate, and return the proof PDF through the portal.'
    }
  };

  const state = {
    token: sessionStorage.getItem('acadiaAuthorHubToken') || '',
    portal: null,
    activeTask: '',
    proof: null,
    proofObjectUrl: '',
    clientId: getClientId_()
  };

  const $ = id => document.getElementById(id);

  document.addEventListener('DOMContentLoaded', init_);

  function init_() {
    const bannerImage = $('siteBannerImage');
    const bannerFallback = $('siteBannerFallback');
    if (BOOT.bannerUrl && bannerImage) {
      bannerImage.onload = function () {
        bannerImage.classList.remove('hidden');
        if (bannerFallback) bannerFallback.classList.add('hidden');
      };
      bannerImage.onerror = function () {
        bannerImage.classList.add('hidden');
        if (bannerFallback) bannerFallback.classList.remove('hidden');
      };
      bannerImage.src = BOOT.bannerUrl;
    }
    updateDeadlineBar_();
    window.setInterval(updateConferenceCountdown_, 30000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) updateConferenceCountdown_();
    });
    window.addEventListener('pageshow', updateConferenceCountdown_);
    renderFooter_();
    const loginMode = $('loginMode');
    if (loginMode) loginMode.addEventListener('change', updateLoginMode_);
    $('loginButton').addEventListener('click', login_);
    $('loginTitle').addEventListener('keydown', e => { if (e.key === 'Enter') login_(); });
    $('loginPaperId').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginTitle').focus(); });
    const loginBookTitle = $('loginBookTitle');
    if (loginBookTitle) loginBookTitle.addEventListener('keydown', e => { if (e.key === 'Enter') login_(); });
    $('refreshButton').addEventListener('click', function () { leaveTaskSafely_(()=>refreshPortal_(false)); });
    $('logoutButton').addEventListener('click', ()=>leaveTaskSafely_(logout_));
    $('backButton').addEventListener('click', ()=>leaveTaskSafely_(showPortal_));
    $('saveTaskButton').addEventListener('click', () => saveActiveTask_(false));
    $('submitTaskButton').addEventListener('click', () => saveActiveTask_(true));
    $('contactLink').href = BOOT.contactEmail
      ? 'mailto:' + encodeURIComponent(BOOT.contactEmail) + '?subject=' + encodeURIComponent("__ACADIA_TEXT_t0040__")
      : 'mailto:?subject=' + encodeURIComponent("__ACADIA_TEXT_t0040__");

    const visaOpenButton = $('visaLetterOpenButton');
    const visaCloseButton = $('visaLetterCloseButton');
    const visaCancelButton = $('visaLetterCancelButton');
    const visaGenerateButton = $('visaLetterGenerateButton');
    const visaModal = $('visaLetterModal');
    if (visaOpenButton) visaOpenButton.addEventListener('click', openVisaLetterModal_);
    if (visaCloseButton) visaCloseButton.addEventListener('click', closeVisaLetterModal_);
    if (visaCancelButton) visaCancelButton.addEventListener('click', closeVisaLetterModal_);
    if (visaGenerateButton) visaGenerateButton.addEventListener('click', generateVisaLetter_);
    if (visaModal) visaModal.addEventListener('click', function (event) {
      if (event.target === visaModal) closeVisaLetterModal_();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeVisaLetterModal_();
    });

    window.addEventListener('pageshow', function () {
      $('transitionOverlay').classList.remove('active');
      setLoading_(false);
    });

    $('taskContent').addEventListener('input',scheduleAutoSave_);
    $('taskContent').addEventListener('change',scheduleAutoSave_);
    window.addEventListener('online',()=>{if(hasUnsavedChanges_())flushAutoSave_();});
    window.addEventListener('beforeunload',function(event){if(hasUnsavedChanges_()||authorUploadBusy_){event.preventDefault();event.returnValue='';}});
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&hasUnsavedChanges_())flushAutoSave_();});
    initAcceptanceLetter_();
    updateLoginMode_();
    if (state.token) refreshPortal_(true);
  }

  function updateLoginMode_() {
    const isBookForum = Boolean($('loginMode') && $('loginMode').value === 'book_forum');
    if ($('standardLoginFields')) $('standardLoginFields').classList.toggle('hidden', isBookForum);
    if ($('bookForumLoginFields')) $('bookForumLoginFields').classList.toggle('hidden', !isBookForum);
    if ($('loginRequiredTasks')) $('loginRequiredTasks').textContent = isBookForum ? '3 required tasks' : 'Tasks 1–6 + registration';
    if ($('loginLaterStage')) $('loginLaterStage').textContent = isBookForum ? 'Presentation upload' : 'Conference presentation for main-conference tracks; author proof review';
    if ($('loginAccessMethod')) $('loginAccessMethod').textContent = isBookForum ? 'Complete book title only' : 'Paper ID + original title';
    if ($('loginError')) $('loginError').style.display = 'none';
    updateDeadlineBar_();
  }

  function conferenceCountdownText_(now) {
    // Compare Detroit calendar dates, independent of the visitor's time zone.
    const dateParts = new Intl.DateTimeFormat('en-US', {
      timeZone: "__ACADIA_TEXT_t0023__", year: 'numeric', month: 'numeric', day: 'numeric'
    }).formatToParts(now || new Date());
    const parts = {};
    dateParts.forEach(part => { parts[part.type] = part.value; });
    const today = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day));
    const days = Math.round((Date.parse("__ACADIA_VALUE_conferenceStart__" + "T00:00:00Z") - today) / 86400000);
    if (days > 0) {
      return 'Only ' + days + (days === 1 ? ' day' : ' days') +
        "__ACADIA_TEXT_t0041__";
    }
    if (days === 0) return "__ACADIA_TEXT_t0042__";
    if (days >= -2) return "__ACADIA_TEXT_t0043__";
    return "__ACADIA_TEXT_t0044__";
  }

  function updateConferenceCountdown_() {
    const line = $('conferenceCountdown');
    if (!line) return;
    const text = conferenceCountdownText_();
    if (line.textContent !== text) line.textContent = text;
  }

  function updateDeadlineBar_() {
    const bar = $('deadlineBar');
    if (!bar) return;
    bar.classList.remove('closed');
    bar.textContent = '';

    const mainLine = document.createElement('div');
    mainLine.id = 'conferenceCountdown';
    mainLine.className = 'deadline-main';
    mainLine.textContent = conferenceCountdownText_();
    bar.appendChild(mainLine);

    const detailLine = document.createElement('div');
    detailLine.className = 'deadline-extra';
    const isPhd = Boolean(state.portal && state.portal.submission &&
      state.portal.submission.track === 'PhD Workshop');
    if (isPhd) {
      detailLine.textContent = (state.portal.phdWorkshopOpen
        ? 'PhD Workshop materials are open for submissions and revisions. Earlier uploads are retained. '
        : 'PhD Workshop materials submissions are closed. ') +
        'Conference registration is due by ' +
        (BOOT.registrationDeadlineLabel || "__ACADIA_TEXT_t0012__") + '.';
    } else {
      const data = presentationState_.data;
      const sub = state.portal && state.portal.submission;
      const requirements = data && sub && String(data.paperId) === String(sub.paperId) ? data.requirements : null;
      detailLine.textContent = requirements && requirements.confirmed
        ? 'Your presentation: ' + requirements.dateLabel + '. Upload your final slides or presentation video by ' + requirements.deadlineLabel + "__ACADIA_TEXT_t0045__"
        : "__ACADIA_TEXT_t0046__";
    }
    if(state.portal&&state.portal.authorUpdatesOpen)detailLine.textContent+=' Author information remains open for updates. Form changes save automatically; previous file versions are retained.';
    detailLine.textContent = DEADLINE_NOTICE + ' ' + detailLine.textContent;
    bar.appendChild(detailLine);
  }

  function renderFooter_() {
    const sites = (BOOT.siteChairs || []).map(esc_).join(' · ');
    const tech = (BOOT.technicalChairs || []).map(esc_).join(' · ');
    $('footerChairs').innerHTML = '<strong>Site Chairs</strong> ' + sites + '<br><strong>Technical Chairs</strong> ' + tech;
  }

  async function login_() {
    const isBookForum = Boolean($('loginMode') && $('loginMode').value === 'book_forum');
    const paperId = $('loginPaperId').value.trim();
    const title = $('loginTitle').value.trim();
    const bookTitle = $('loginBookTitle') ? $('loginBookTitle').value.trim() : '';
    $('loginError').style.display = 'none';
    if (isBookForum && !bookTitle) return showLoginError_('Enter the complete accepted book title.');
    if (!isBookForum && (!paperId || !title)) return showLoginError_('Enter both the Paper ID and original paper title.');
    setLoading_(true);
    try {
      const result = isBookForum
        ? await gas_('loginBookForum', bookTitle, state.clientId)
        : await gas_('loginAuthor', paperId, title, state.clientId);

      if (!result || !result.token) {
        throw new Error('The portal login response was empty. Please try again.');
      }

      // All tracks now return the portal in one request. Keep the token-only
      // fallback for compatibility with earlier server deployments.
      if (!result.portal) {
        result.portal = parsePortalPayload_(await gas_('getPortalData', result.token));
      }
      if (!result.portal || !result.portal.submission) {
        throw new Error('The submission portal data could not be loaded. Please try again.');
      }

      state.token = result.token;
      state.portal = result.portal;
      sessionStorage.setItem('acadiaAuthorHubToken', state.token);
      showPortal_();

      // Keep the activity record, but write it after the portal is visible.
      presentationSyncExpired_ = false;
      if (result.logPortalOpen || (!isBookForum && state.portal.submission.track === 'Field Note')) {
        gas_('recordPortalOpened', state.token).catch(function (err) {
          console.warn('Could not record portal-opened activity:', friendlyError_(err));
        });
      }
    } catch (err) {
      showLoginError_(friendlyError_(err));
    } finally {
      setLoading_(false);
    }
  }

  function showLoginError_(message) {
    $('loginError').textContent = message;
    $('loginError').style.display = 'block';
  }

  async function refreshPortal_(silent) {
    if (presentationBusyGuard_()) return;
    if (!state.token) return;
    if (!silent) setLoading_(true);
    try {
      state.portal = parsePortalPayload_(await gas_('getPortalData', state.token));
      if (!state.portal || !state.portal.submission) {
        throw new Error('The submission portal data could not be loaded. Please try again.');
      }
      showPortal_();
      if (!silent) toast_('Status refreshed.');
    } catch (err) {
      sessionStorage.removeItem('acadiaAuthorHubToken');
      state.token = '';
      state.portal = null;
      showLogin_();
      if (!silent) toast_(friendlyError_(err), true);
    } finally {
      if (!silent) setLoading_(false);
    }
  }

  function logout_() {
    if (presentationBusyGuard_()) return;
    sessionStorage.removeItem('acadiaAuthorHubToken');
    state.token = '';
    state.portal = null;
    state.activeTask = '';
    revokeProofUrl_();
    showLogin_();
    updateDeadlineBar_();
  }

  function showLogin_() {
    $('loginView').classList.remove('hidden');
    $('portalView').classList.add('hidden');
    $('taskView').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showPortal_() {
    if (presentationBusyGuard_()) return;
    if (!state.portal) return showLogin_();
    state.activeTask = '';
    revokeProofUrl_();
    $('loginView').classList.add('hidden');
    $('taskView').classList.add('hidden');
    $('portalView').classList.remove('hidden');
    renderPortal_();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderPortal_() {
    const portal = state.portal;
    const sub = portal.submission;
    const isPhd = sub.track === 'PhD Workshop';
    const isBookForum = sub.track === 'Book Forum';
    $('portalEyebrow').textContent = 'Submission ' + sub.paperId + ' · ' + (sub.track || 'Accepted submission');
    $('portalTitle').textContent = sub.finalTitle || sub.originalTitle;
    $('portalMeta').textContent = [sub.volume, sub.correspondingAuthor ? 'Corresponding author: ' + sub.correspondingAuthor : '', 'Final acceptance pending completion and review'].filter(Boolean).join(' · ');
    $('sidePaperId').textContent = sub.paperId;
    $('sideDeadline').textContent = isBookForum ? BOOK_FORUM_DEADLINE_LABEL
      : isPhd ? (BOOT.phdWorkshopDeadlineLabel || "__ACADIA_TEXT_t0009__")
      : (BOOT.deadlineLabel || "__ACADIA_TEXT_t0007__");

    const visaCard = $('visaLetterCard');
    if (visaCard) visaCard.classList.toggle('hidden', !BOOT.visaLetterEnabled);

    const requiredTasks = portal.tasks.filter(function (task) {
      if (task.phase !== 'required') return false;
      if (!isPhd && ['phd_poster', 'volunteer'].includes(task.id)) return false;
      return true;
    });
    const doneStatuses = ['Submitted', 'Under review', 'Approved'];
    const completed = requiredTasks.filter(t => doneStatuses.includes(t.status)).length;
    const total = requiredTasks.length;
    const percent = total ? Math.round(completed / total * 100) : 0;
    $('progressText').textContent = completed + ' of ' + total;
    $('progressPercent').textContent = percent + '%';
    $('progressBar').style.width = percent + '%';

    const materialTasks = requiredTasks.filter(t => t.id !== 'registration');
    const materialRemaining = materialTasks.filter(t => !doneStatuses.includes(t.status)).length;
    const registrationTask = requiredTasks.find(t => t.id === 'registration');
    const registrationRemaining = !registrationTask || !doneStatuses.includes(registrationTask.status);
    let todoText;

    if (isBookForum) {
      todoText = materialRemaining
        ? materialRemaining + ' Book Forum ' + (materialRemaining === 1 ? 'file task remains' : 'file tasks remain') + '. Conference registration is also required.'
        : registrationRemaining
          ? 'The Poster and Proceedings Pages have been submitted. Conference Registration remains.'
          : 'All three required Book Forum tasks have been submitted. The Technical Chairs will contact you if corrections are needed.';
    } else if (isPhd) {
      todoText = materialRemaining
        ? materialRemaining + ' PhD Workshop ' + (materialRemaining === 1 ? 'task remains' : 'tasks remain') + '. Conference registration is Task 7.'
        : registrationRemaining
          ? 'Tasks 1–6 have been submitted. Task 7 (Conference Registration) remains.'
          : 'All seven required PhD Workshop tasks have been submitted. The organizing team will contact you if corrections are needed.';
    } else {
      todoText = materialRemaining
        ? materialRemaining + ' camera-ready ' + (materialRemaining === 1 ? 'task remains' : 'tasks remain') + ' before ' + (BOOT.deadlineLabel || 'the camera-ready deadline') + '. Conference registration is due by ' + (BOOT.registrationDeadlineLabel || "__ACADIA_TEXT_t0012__") + '.'
        : registrationRemaining
          ? 'Tasks 1–6 have been submitted. Task 7 (Conference Registration) remains due by ' + (BOOT.registrationDeadlineLabel || "__ACADIA_TEXT_t0012__") + '.'
          : 'All seven required tasks have been submitted. The Technical Chairs will contact you if corrections are needed.';

      const posterRequired = ['Projects', 'Field Note'].includes(sub.track);
      const projectPosterFile = posterRequired
        ? activeFile_('camera_ready', 'project_poster_pdf')
        : null;
      if (posterRequired && !projectPosterFile) {
        todoText += ' Your required exhibition poster is due by ' +
          (BOOT.projectPosterDeadlineLabel || "__ACADIA_TEXT_t0047__") + '.';
      }
    }
    $('todoSummary').textContent = todoText;

    setOverallStatus_(sub.overallStatus || (isBookForum ? 'Book Forum materials in progress' : (isPhd ? 'Workshop materials in progress' : 'Camera-ready in progress')));
    $('requiredTaskList').innerHTML = requiredTasks.concat(portal.tasks.filter(t=>t.phase==='optional')).map(taskCard_).join('');

    const proofTask = portal.tasks.find(t => t.id === 'author_proof');
    $('proofTaskList').innerHTML = proofTask ? taskCard_(proofTask) : '';

    const presentationTask = portal.tasks.find(t => t.id === 'presentation');
    const presentationCard = $('presentationTemplateCard');
    if (presentationCard) {
      presentationCard.classList.toggle('hidden', !presentationTask);
      presentationCard.innerHTML = presentationTask ? taskCard_(presentationTask) : '';
    }
    $('acceptanceLetterCard').classList.toggle('hidden', !['Full Paper', 'Projects', 'Field Note', 'PhD Workshop', 'Book Forum'].includes(sub.track));
    const laterStageLabel = $('laterStageLabel');
    if (laterStageLabel) {
      laterStageLabel.classList.toggle('hidden', !proofTask && !presentationTask);
      laterStageLabel.textContent = presentationTask ? 'Conference presentation and publication stages' : 'Later publication stage';
    }
    const registrationCoverageNote = $('registrationCoverageNote');
    if (registrationCoverageNote) registrationCoverageNote.classList.toggle('hidden', isPhd || isBookForum);

    $('activityList').innerHTML = portal.activity.length
      ? portal.activity.map(eventHtml_).join('')
      : '<div class="meta">No activity has been recorded yet.</div>';
    updateDeadlineBar_();
  }

  function setOverallStatus_(status) {
    const el = $('overallStatus');
    el.textContent = status;
    el.className = 'status ' + (
      /action required/i.test(status) ? 'status-action' :
      /complete|final acceptance/i.test(status) ? 'status-good' :
      /review pending|submitted/i.test(status) ? 'status-review' : 'status-open'
    );
  }

  function taskCard_(task) {
    const info = TASK_INFO[task.id] || { number: '?', title: task.name, description: '' };
    const isPaperRevisionTask = task.id === 'camera_ready' && state.portal &&
      state.portal.submission.track === 'Full Paper' && isTaskOpen_(task.id);
    const locked = task.status === 'Locked' && !isTaskOpen_(task.id);
    const isPhd = state.portal && state.portal.submission.track === 'PhD Workshop';
    const isBookForum = state.portal && state.portal.submission.track === 'Book Forum';
    const isProjectPosterTask = task.id === 'camera_ready' &&
      state.portal && state.portal.projectPosterRequired;
    const posterFile = isProjectPosterTask ? activeFile_('camera_ready', 'project_poster_pdf') : null;
    const proofReturn = task.id === 'author_proof' ? activeFile_('author_proof', 'author_annotated_proof_pdf') : null;
    const description = isPaperRevisionTask
      ? 'Upload a revised InDesign package when requested by the copyeditor. All earlier uploads are retained.'
      : isProjectPosterTask
      ? (posterFile
        ? 'Camera-ready publication package submitted. Required exhibition poster uploaded.'
        : 'Additional exhibition requirement: download the poster template and upload the final poster by ' +
          (BOOT.projectPosterDeadlineLabel || "__ACADIA_TEXT_t0047__") + '.')
      : task.id === 'author_proof'
        ? (proofReturn
          ? 'Annotated proof PDF uploaded. Submit the task after all requested replacement files are included.'
          : info.description)
        : task.id === 'registration' && isBookForum
          ? 'Complete conference registration for this Book Forum entry and upload the confirmation-page PDF.'
        : task.id === 'registration' && isPhd
          ? 'Use the 100% discount promo code sent separately, complete conference registration, and upload the confirmation-page PDF.'
        : info.description;
    const posterPill = isProjectPosterTask
      ? '<span class="pill ' + (posterFile ? 'pill-approved' : 'pill-action') + '">' +
        (posterFile ? 'Exhibition Poster uploaded' : 'Exhibition Poster due') + '</span>'
      : '';
    const buttonLabel = isPaperRevisionTask
      ? 'Upload / view revisions'
      : task.id === 'author_proof'
      ? (proofReturn ? 'Review return' : 'Download / return proof')
      : (isProjectPosterTask && !posterFile ? 'Open / upload Exhibition Poster' : 'Open');

    return '<div class="task-card">' +
      '<div class="task-number">' + esc_((task.phase === 'required' || task.id === 'presentation') ? String(task.order) : info.number) + '</div>' +
      '<div><h4>' + esc_(info.title) + '</h4><p>' + esc_(task.actionRequiredNote || description) + '</p></div>' +
      '<div class="task-actions">' + posterPill + '<span class="pill ' + statusClass_(task.status) + '">' + esc_(task.status) + '</span>' +
      '<button class="btn btn-secondary btn-small" type="button" ' + (locked ? 'disabled' : '') +
      ' onclick="window.ACADIA.openTask(\'' + escAttr_(task.id) + '\')">' + esc_(buttonLabel) + '</button></div></div>';
  }

  function eventHtml_(event) {
    const date = event.timestamp ? new Date(event.timestamp).toLocaleString() : '';
    return '<div class="event"><div class="event-dot"></div><div><strong>' + esc_(event.event) + '</strong><span>' + esc_(event.detail || '') + (date ? '<br>' + esc_(date) : '') + '</span></div></div>';
  }

  async function openTask_(taskId) {
    if (presentationBusyGuard_()) return;
    const currentTrack = state.portal && state.portal.submission
      ? state.portal.submission.track
      : '';
    if (['phd_poster', 'volunteer'].includes(taskId) && currentTrack !== 'PhD Workshop') {
      return toast_('This task is available only to the PhD Workshop track.', true);
    }
    const task = getTask_(taskId);
    const paperRevisionOpen = taskId === 'camera_ready' && currentTrack === 'Full Paper' && isTaskOpen_(taskId);
    if (!task || (task.status === 'Locked' && !isTaskOpen_(taskId))) return toast_('This publication stage is not open yet.', true);
    if(authorUploadBusy_)return toast_('Please wait for the file upload to finish.',true);
    if(!(await flushAutoSave_()))return;
    state.activeTask = taskId;
    $('portalView').classList.add('hidden');
    $('loginView').classList.add('hidden');
    $('taskView').classList.remove('hidden');
    renderTaskShell_(task);
    renderTaskContent_();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (taskId === 'author_proof') await loadProof_();
  }

  function renderTaskShell_(task) {
    if (task.id === 'presentation') return renderPresentationShell_(task);
    const info = TASK_INFO[task.id];
    const isPhd = state.portal.submission.track === 'PhD Workshop';
    const isBookForum = state.portal.submission.track === 'Book Forum';
    const requiredCount = state.portal.tasks.filter(t => t.phase === 'required').length;
    $('taskEyebrow').textContent = task.phase === 'later'
      ? 'Later publication stage'
      : task.phase==='optional' ? 'Publication information' : 'Required task ' + task.order + ' of ' + requiredCount;

          : task.id === 'phd_poster'
            ? 'Upload one press-quality PDF, then click Submit task.'
            : task.id === 'book_poster'

  function renderProof_() {
    // Revoke only the previous browser object URL. Keep state.proof because it
    // contains the PDF payload returned by getAuthorProof().
    if (state.proofObjectUrl) URL.revokeObjectURL(state.proofObjectUrl);
    state.proofObjectUrl = '';
    if (!state.proof || !state.proof.base64) {
      throw new Error('The author proof PDF response is empty.');
    }
    const binary = atob(state.proof.base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    state.proofObjectUrl = URL.createObjectURL(new Blob([bytes], { type: state.proof.mimeType || 'application/pdf' }));

    const task = getTask_('author_proof');
    const proofOpen = isTaskOpen_('author_proof');
    const draft = state.proof.draft || { authorName: '', confirmed: false };
    const responseFile = state.proof.authorResponse || activeFile_('author_proof', 'author_annotated_proof_pdf');
    const attachmentSlots = Math.max(1, Math.min(5, Number(BOOT.authorProofAttachmentSlots || 5)));
    const attachmentsByRole = {};
    (state.proof.attachments || []).forEach(file => { attachmentsByRole[file.role] = file; });

    const responseUploader = proofOpen
      ? '<div class="upload-zone"><input id="annotatedProofInput" type="file" accept="application/pdf,.pdf">' +

      : '<div class="notice-box" style="display:block">This Author Proof return has been submitted. Contact the Technical Chairs if another upload is required.</div>';

    const attachmentCards = Array.from({ length: attachmentSlots }, (_, index) => {
      const slot = index + 1;
      const slotLabel = String(slot).padStart(2, '0');
      const role = 'author_proof_attachment_' + slotLabel;

      '<p>Download the PDF prepared by the copyeditor. Open it in Adobe Acrobat, Adobe Acrobat Reader, or another PDF application that preserves annotations. Use the Comment tools to answer every copyeditor query and mark each requested correction directly in the PDF. Save the annotated PDF locally before returning here.</p>' +
      '<div class="button-row"><a class="btn btn-primary" href="' + escAttr_(state.proofObjectUrl) + '" download="' + escAttr_(state.proof.fileName) + '">Download copyedited proof PDF</a>' +
      '<a class="btn btn-secondary" href="' + escAttr_(state.proofObjectUrl) + '" target="_blank" rel="noopener">Open PDF in a new tab</a></div>' +
      '<div class="file-chip"><span>' + esc_(state.proof.fileName) + '</span><span>Proof ' + esc_(state.proof.version || '') + '</span></div>' +
      (state.proof.dueLabel ? '<div class="rule-note">Author proof response due: ' + esc_(state.proof.dueLabel) + '</div>' : '') + '</div>' +

      '<div class="content-box"><h3>2. Upload the annotated PDF</h3>' +
      '<p>Upload the PDF in which you answered the copyeditor’s queries and added your corrections. Do not upload a newly typeset manuscript or an unannotated replacement PDF.</p>' +
      responseUploader + fileChip_(responseFile) +
      '<div class="upload-progress"><div id="annotatedProofProgress"></div></div><div id="annotatedProofMessage" class="upload-message"></div></div>' +

      '<div class="content-box"><h3>3. Optional replacement or supporting files</h3>' +
      '<p>Upload only files specifically requested by the copyeditor, such as corrected or higher-resolution figures. Up to ' + attachmentSlots + ' files may be returned separately. Accepted formats: JPG, PNG, TIFF, PDF, EPS, AI, PSD, SVG, or ZIP.</p>' +
      '<div class="download-grid">' + attachmentCards + '</div></div>' +

      '<div class="content-box"><h3>4. Submit the completed return package</h3>' +
      '<div class="field"><label for="proofAuthorName">Author completing this review</label><input id="proofAuthorName" value="' + escAttr_(draft.authorName || '') + '" ' + (proofOpen ? '' : 'disabled') + '></div>' +

  // A single queue keeps the last edit authoritative, including edits made during a save.
  const autoSave_ = {task:'', saved:'', timer:null, pending:null, suspended:false};
  let authorUploadBusy_ = false;
  function collectTaskSave_() {
    const id=state.activeTask;
    if(!id || !isTaskOpen_(id))return null;
    if(id==='feedback')return {fn:'saveFeedbackTask',payload:{revisionSummary:value_('revisionSummary'),confirmed:checked_('reviewConfirmed')}};
    if(id==='metadata' && $('finalTitle'))return {fn:'saveMetadataTask',payload:collectMetadata_()};
    if(id==='attendance')return {fn:'saveAttendanceTask',payload:{confirmed:checked_('attendanceConfirmed'),presenterName:value_('attendancePresenterName'),presenterEmail:value_('attendancePresenterEmail')}};
    if(id==='registration')return {fn:'saveRegistrationTask',payload:{registeredAuthor:value_('registeredAuthor'),registeredEmail:value_('registeredEmail'),confirmationNumber:value_('registrationNumber')}};
    if(id==='indexing')return {fn:'saveIndexingTask',payload:{confirmed:checked_('indexConfirmed'),confirmationNote:value_('indexNote')}};
    if(id==='volunteer')return {fn:'savePhdWorkshopVolunteerTask',payload:{preferences:Array.from(document.querySelectorAll('[data-volunteer-option]:checked')).map(input=>input.value),otherPreference:value_('volunteerOtherPreference'),availabilitySlots:Array.from(document.querySelectorAll('[data-volunteer-slot]:checked')).map(input=>input.value),confirmed:checked_('volunteerConfirmed')}};
    if(id==='author_proof' && $('proofAuthorName'))return {fn:'saveAuthorProof',payload:collectProof_()};
    return null;
  }
  function autoSaveMessage_(message,error) {
    const el=$('lastSave');if(!el)return;
    el.textContent=message;el.setAttribute('role','status');el.style.color=error?'#a32828':'';
  }
  function beginAutoSave_() {
    clearTimeout(autoSave_.timer);autoSave_.task=state.activeTask;
    const request=collectTaskSave_();autoSave_.saved=request?JSON.stringify(request):'';
    if(request)autoSaveMessage_('Changes save automatically.');
  }
  function hasUnsavedChanges_() {
    const request=collectTaskSave_();
    return Boolean(autoSave_.pending || (request && autoSave_.task===state.activeTask && JSON.stringify(request)!==autoSave_.saved));
  }
  function scheduleAutoSave_(event) {
    if(autoSave_.suspended || (event && event.target && (event.target.type==='file' || !event.target.closest('#taskContent'))))return;
    if(state.activeTask==='metadata' && event && event.target){
      const target=event.target,rows=Array.from(document.querySelectorAll('#authorsWrap .author-row'));
      if(target.id==='correspondingEmail'){
        const selected=rows.filter(row=>row.querySelector('[data-author="corresponding"]').checked);
        if(selected.length===1)selected[0].querySelector('[data-author="email"]').value=target.value;
      } else if(target.matches('[data-author="email"], [data-author="corresponding"]')){
        const row=target.closest('.author-row');
        if(row && row.querySelector('[data-author="corresponding"]').checked)$('correspondingEmail').value=row.querySelector('[data-author="email"]').value;
      }
    }
    if(!hasUnsavedChanges_())return;
    clearTimeout(autoSave_.timer);autoSaveMessage_('Unsaved changes — saving shortly…');
    autoSave_.timer=setTimeout(flushAutoSave_,1500);
  }
  async function flushAutoSave_() {
    clearTimeout(autoSave_.timer);
    if(autoSave_.pending)return autoSave_.pending;
    const task=state.activeTask,token=state.token;
    if(!token || autoSave_.task!==task)return true;
    const first=collectTaskSave_();if(!first || JSON.stringify(first)===autoSave_.saved)return true;
    autoSave_.pending=(async function(){
      try {
        while(state.activeTask===task && state.token===token){
          const request=collectTaskSave_();if(!request)break;
          const signature=JSON.stringify(request);if(signature===autoSave_.saved)break;
          autoSaveMessage_('Saving changes…');
          const portal=parsePortalPayload_(await gas_(request.fn,token,request.payload,false));
          if(state.activeTask!==task || state.token!==token)return false;
          if(!portal || !portal.submission)throw new Error('The save response could not be verified. Please retry.');
          state.portal=portal;autoSave_.saved=signature;
          const latest=getTask_(task);if(latest){$('taskStatus').textContent=latest.status;$('taskStatus').className='pill '+statusClass_(latest.status);}
          if(task==='author_proof' && state.proof)state.proof.draft=Object.assign({},state.proof.draft,request.payload);
          // Do not redraw inputs: the author may be typing the next edit.
        }
        autoSaveMessage_('All changes saved · '+new Date().toLocaleTimeString());return true;
      } catch(err){autoSaveMessage_('Not saved: '+friendlyError_(err)+' Your edits remain here; use Save changes to retry.',true);return false;}
    })();
    try{return await autoSave_.pending;}finally{autoSave_.pending=null;}
  }
  async function leaveTaskSafely_(action) {
    if(presentationBusyGuard_())return;
    if(authorUploadBusy_)return toast_('Please wait for the file upload to finish.',true);
    if(await flushAutoSave_())return action();
    toast_('Your changes have not been saved. Please retry before leaving this task.',true);
  }
  function removeAuthor_(button){button.parentElement.remove();scheduleAutoSave_();}

  async function saveActiveTask_(submit) {
    if(!state.activeTask)return;
    if(state.activeTask==='presentation')return startPresentationClient_();
    if(authorUploadBusy_)return toast_('Please wait for the file upload to finish.',true);
    if(!(await flushAutoSave_()))return;
    if(['camera_ready','phd_poster','consent','book_poster','book_proceeding'].includes(state.activeTask)){
      if(submit)return submitFileTask_();
      return toast_('Uploaded files are saved automatically.');
    }
    if(!submit)return toast_('All changes saved.');
    const request=collectTaskSave_();if(!request)return;
    autoSave_.suspended=true;setLoading_(true);
    try {
      state.portal=parsePortalPayload_(await gas_(request.fn,state.token,request.payload,true));
      autoSave_.saved=JSON.stringify(request);toast_('Task submitted.');showPortal_();
    } catch(err){toast_(friendlyError_(err),true);}
    finally{autoSave_.suspended=false;setLoading_(false);}
  }

  async function uploadTaskFile_(taskId, role, inputId, progressId, messageId) {
    if(!(await flushAutoSave_()))return;
    const input = $(inputId);
    const file = input && input.files && input.files[0];
    if (!file) return toast_('Choose a file first.', true);
    if (!isUploadOpen_(taskId, role)) {
      return toast_(taskId === 'author_proof'
        ? 'The Author Proof return is not currently open.'
        : taskId === 'registration'
          ? 'Conference registration is closed.'
          : 'This upload is not currently open.', true);
    }

    // Preserve typed registration or Author Proof information before the upload
    // causes the task view to refresh from the server-side record.
    if (taskId === 'registration') {
      setLoading_(true);
      try {
        state.portal = await gas_('saveRegistrationTask', state.token, {
          registeredAuthor: value_('registeredAuthor'),
          registeredEmail: value_('registeredEmail'),
          confirmationNumber: value_('registrationNumber')
        }, false);
      } catch (err) {
        setLoading_(false);
        return toast_(friendlyError_(err), true);
      }
      setLoading_(false);
    } else if (taskId === 'author_proof') {
      setLoading_(true);
      try {
        await gas_('saveAuthorProofDraftForUpload', state.token, collectProof_());
      } catch (err) {
        setLoading_(false);
        return toast_(friendlyError_(err), true);
      }
      setLoading_(false);
    }

    await performUpload_(taskId, role, file, progressId, messageId);
  }

  }

  async function performUpload_(taskId, role, file, progressId, messageId) {
    if(authorUploadBusy_)return toast_('A file upload is already in progress.',true);
    if (!isUploadOpen_(taskId, role)) {
      const closedMessage = taskId === 'registration'
        ? 'Conference registration is closed.'
        : taskId === 'author_proof'
          ? 'The Author Proof return is not currently open.'
          : taskId === 'camera_ready' && role === 'project_poster_pdf'
            ? 'The Author Portal is currently disabled.'
            : 'Tasks 1–6 are closed.';
      return toast_(closedMessage, true);
    }
    const progress = $(progressId);
    const message = $(messageId);
    if (progress) progress.style.width = '0%';
    if (message) message.textContent = 'Preparing secure Google Drive upload…';
    authorUploadBusy_=true;
    setLoading_(true);
    try {
      const upload = await gas_('createDriveUploadSession', state.token, {
        taskId, role, originalName: file.name, mimeType: file.type || 'application/octet-stream', sizeBytes: file.size
      });
      setLoading_(false);
      const finalized = await uploadChunksThroughAppsScript_(upload.receipt, file, upload.chunkBytes || BOOT.uploadChunkBytes, percent => {
        if (progress) progress.style.width = percent.toFixed(1) + '%';
        if (message) message.textContent = 'Uploading ' + humanBytes_(file.size) + ' · ' + Math.floor(percent) + '%';
      });
      state.portal = finalized.portal;
      if(!(await flushAutoSave_()))return;
      if (progress) progress.style.width = '100%';
      if (message) message.textContent = finalized.fileName + ' uploaded successfully.';
      toast_('File uploaded to Google Drive.');
      renderTaskShell_(getTask_(state.activeTask));
      if (state.activeTask === 'author_proof') await loadProof_();
      else renderTaskContent_();
    } catch (err) {
      if (message) message.textContent = friendlyError_(err);
      toast_(friendlyError_(err), true);

  /**
   * Sends fixed-size file chunks to Apps Script. The server forwards each chunk
   * into a private Drive resumable-upload session, so no OAuth token or Drive
   * upload URL is exposed to the browser.
   */
  async function uploadChunksThroughAppsScript_(receipt, file, chunkBytes, onProgress) {
    const unit = 256 * 1024;
    const chunkSize = Math.max(unit, Math.floor(Number(chunkBytes || 8 * 1024 * 1024) / unit) * unit);
    let offset = 0;
    let attempts = 0;

    while (offset < file.size) {
      const endExclusive = Math.min(offset + chunkSize, file.size);
      const chunk = file.slice(offset, endExclusive);
      const base64 = await blobToBase64_(chunk);
      try {
        const result = await gas_('uploadDriveChunk', state.token, receipt, offset, base64);
        if (result.complete) {
          onProgress(100);
          return result;
        }
        const next = Number(result.nextOffset || endExclusive);
        if (!Number.isFinite(next) || next <= offset || next > file.size) {
          throw new Error('Google Drive returned an invalid upload offset.');
        }
        offset = next;
        attempts = 0;
        onProgress(offset / file.size * 100);
      } catch (err) {
        attempts += 1;
        if (attempts > 5) throw err;
        await wait_(Math.min(10000, attempts * 1600));
        try {
          const status = await gas_('queryDriveUploadStatus', state.token, receipt);
          if (status.complete) {
            onProgress(100);
            return status;
          }
          const recovered = Number(status.nextOffset || 0);
          if (Number.isFinite(recovered) && recovered >= 0 && recovered <= file.size) {
            offset = recovered;
            onProgress(offset / file.size * 100);
          }
        } catch (statusError) {
          if (attempts > 4) throw statusError;
        }
      }
    }
    throw new Error('The upload ended without a Google Drive completion response.');
  }

  function blobToBase64_(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('The selected file chunk could not be read.'));
      reader.onload = () => {
        const result = String(reader.result || '');
        const comma = result.indexOf(',');
        resolve(comma >= 0 ? result.slice(comma + 1) : result);
      };
      reader.readAsDataURL(blob);
    });
  }

  async function generateAcceptanceLetter_() {

      const result = await gas_('generateOfficialAcceptanceLetter', token, {recordKey: record.recordKey, confirmed: true});
      if (token !== state.token) return;
      if (!result || !result.base64 || result.mimeType !== 'application/pdf') throw new Error('The PDF could not be generated. Please try again.');
      const binary = atob(result.base64);

      (data.pending?'<p class="rule-note">An unfinished upload is available: '+esc_(data.pending.originalName)+'. Select the same unchanged file and click Upload / resume.</p>':'')+
      '<div class="field"><label for="presName">Actual presenter’s full name</label><input id="presName" maxlength="160" value="'+escAttr_(data.pending?data.pending.presenterName:data.presenterName)+'"></div>'+
      (isBook?'':'<div class="field"><label for="presLastName">Presenter’s family / last name</label><input id="presLastName" maxlength="80" value="'+escAttr_(data.pending?data.pending.presenterLastName:data.presenterLastName)+'"><p>Please enter your full family name, including compound surnames. It will be used in the filename.</p></div>')+
      '<p>Files are renamed automatically: '+(isBook?'BookTitle.ext':'PaperID_PresenterLastName_PresentationTitle.ext')+', keeping the original extension (for example, .pptx or .mp4). All previous uploaded files are retained.</p>'+
      '<input id="presFile" type="file" accept=".ppt,.pptx,.mp4,.mov,.m4v,.webm,.avi,.mkv"><p>PowerPoint: .ppt, .pptx. Video: .mp4, .mov, .m4v, .webm, .avi, .mkv. Up to '+humanBytes_(data.maxBytes)+' per file. Upload one file at a time. Keep this tab open while uploading. If interrupted, select the same unchanged file to resume.</p>'+
      '<div class="button-row"><button id="presUpload" class="btn btn-primary" '+(data.uploadsEnabled?'':'disabled')+'>Upload / resume</button><button id="presPause" class="btn btn-secondary" disabled>Pause</button>'+
      '<button id="presDiscard" class="btn btn-secondary" '+(data.pending?'':'disabled')+'>Discard unfinished upload</button></div>'+
      '<div class="upload-progress"><div id="presProgress"></div></div><div id="presMessage" class="upload-message" role="status" aria-live="polite"></div>'+
      (!data.uploadsEnabled?'<p>Presentation uploads are temporarily closed.</p>':'')+'</div>';
    $('presRefreshSchedule').onclick=refreshPresentationSchedule_;
    bindPresentationCalendar_();
    updatePresentationRequirements_(data);
    $('presUpload').onclick=startPresentationClient_;
    // Keep the upload action visible before the longer session and venue details.
    $('taskContent').insertBefore($('presUploadBox'),$('taskContent').firstChild);
    if(data.pending) ['presName','presLastName'].forEach(function(id){if($(id)) $(id).disabled=true;});
    $('presPause').onclick=function(){presentationState_.paused=true;if(presentationState_.xhr) presentationState_.xhr.abort();};
    if($('presDiscard')) $('presDiscard').onclick=async function(){
      if(!confirm('Discard this unfinished upload? Previously completed presentations will be kept.')) return;
      try{await gas_('abandonPresentationUpload',state.token,data.pending.uploadId);await loadPresentation_();}catch(e){toast_(friendlyError_(e),true);}
    };
  }

  let presentationCalendarBusy_=false;

  function presentationCalendarCaption_(data) {
    const calendar=data.calendar||{};
    if(!calendar.available)return 'Available when your presentation session has a confirmed date and time.';
    return (calendar.precision==='presentation'?'Your presentation: ':'Your full session: ')+
      calendar.date+' · '+calendar.start+'–'+calendar.end+"__ACADIA_TEXT_t0064__"+
      (calendar.precision==='session'?' Your individual presentation time has not been confirmed.':'');
  }

  function presentationCalendarHtml_(data) {
    const calendar=data.calendar||{};
    if(!calendar.enabled)return '';
    return '<div class="content-box" id="presCalendarBox"><h3>Save to my calendar</h3>'+
      '<p id="presCalendarCaption">'+esc_(presentationCalendarCaption_(data))+'</p>'+
      '<button type="button" class="btn btn-secondary" id="presCalendarOpen" '+(calendar.available?'':'disabled')+'>Save to my calendar</button>'+
      '<div id="presCalendarForm" class="hidden" style="margin-top:16px">'+
      '<div class="field"><label for="presCalendarEmail">Email for your calendar invitation</label>'+
      '<input id="presCalendarEmail" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"></div>'+
      '<p>Use the email address of your Google Calendar or Microsoft Outlook calendar. Accept the invitation to keep the event linked to conference schedule updates.</p>'+
      '<p>Time, location, and session changes will update the same event. Your calendar may ask you to accept an update.</p>'+
      '<button type="button" class="btn btn-primary" id="presCalendarSend">Send calendar invitation</button>'+
      '<div id="presCalendarMessage" class="upload-message" role="status" aria-live="polite"></div></div></div>';
  }

  function updatePresentationCalendar_(data) {
    presentationState_.data=Object.assign({},presentationState_.data,data);
    if($('presCalendarCaption'))$('presCalendarCaption').textContent=presentationCalendarCaption_(data);
    if($('presCalendarOpen'))$('presCalendarOpen').disabled=!(data.calendar&&data.calendar.available);
    if($('presCalendarSend'))$('presCalendarSend').disabled=presentationCalendarBusy_||!(data.calendar&&data.calendar.available);
  }

  function bindPresentationCalendar_() {
    if(!$('presCalendarOpen'))return;
    presentationCalendarBusy_=false;
    $('presCalendarOpen').onclick=function(){
      $('presCalendarForm').classList.remove('hidden');$('presCalendarEmail').focus();
    };
    $('presCalendarSend').onclick=sendPresentationCalendarClient_;
    $('presCalendarEmail').onkeydown=function(event){
      if(event.key==='Enter'){event.preventDefault();sendPresentationCalendarClient_();}
    };
  }

  async function sendPresentationCalendarClient_() {
    if(presentationCalendarBusy_)return;
    const input=$('presCalendarEmail'),button=$('presCalendarSend'),message=$('presCalendarMessage');
    if(!input||!input.reportValidity())return;
    const data=presentationState_.data,calendar=data&&data.calendar;
    if(!calendar||!calendar.available){message.textContent='Please wait for your confirmed session time.';return;}
    const paperId=data.paperId;
    presentationCalendarBusy_=true;button.disabled=true;button.textContent='Sending invitation…';message.textContent='';
    try{
      const result=await gas_('sendPresentationCalendarInvite',state.token,input.value.trim());
      if(state.activeTask==='presentation'&&presentationState_.data&&presentationState_.data.paperId===paperId){
        message.textContent=result.message;
      }
    }catch(err){message.textContent=friendlyError_(err);}
    finally{presentationCalendarBusy_=false;button.disabled=false;button.textContent='Send calendar invitation';}
  }

  let presentationSyncBusy_=false;
  let presentationSyncExpired_=false;
  async function refreshPresentationSchedule_(){
    if(presentationSyncBusy_||presentationSyncExpired_||!state.token||document.hidden||state.activeTask!=='presentation'||!$('presSchedule'))return;
    presentationSyncBusy_=true;
    try{const fresh=await gas_('getPresentationData',state.token);if(state.activeTask==='presentation'&&$('presSchedule')){presentationState_.data.session=fresh.session;presentationState_.data.peers=fresh.peers;renderPresentation_(Object.assign({},fresh,{__scheduleOnly:true}));}}
    catch(e){
      presentationSyncExpired_=/portal session (?:has expired|is invalid)/i.test(friendlyError_(e));
      if($('presSyncNote'))$('presSyncNote').textContent=presentationSyncExpired_
        ? 'Your session has expired. Please sign in again to refresh or upload.'
        : 'Unable to refresh. Showing the last confirmed schedule.';
    }
    finally{presentationSyncBusy_=false;}
  }
  setInterval(function(){if(!presentationState_.busy)refreshPresentationSchedule_();},60000);

  async function presentationFingerprint_(file) {
    const span=1024*1024;
    const sample=new Blob([String(file.size)+':'+String(file.lastModified)+':',file.slice(0,span),file.slice(Math.max(span,file.size-span))]);
    const digest=await crypto.subtle.digest('SHA-256',await sample.arrayBuffer());
    return Array.from(new Uint8Array(digest)).map(function(n){return n.toString(16).padStart(2,'0');}).join('');
  }

  function presentationProgress_(done,total,startTime,startOffset,note) {
    if(!$('presMessage')) return;
    const elapsed=Math.max(0.001,(performance.now()-startTime)/1000),rate=Math.max(0,done-startOffset)/elapsed;
    const eta=rate>0?Math.max(0,(total-done)/rate):0;
    $('presProgress').style.width=Math.min(100,100*done/total).toFixed(1)+'%';
    $('presMessage').textContent=note||Math.min(100,100*done/total).toFixed(1)+'% · '+humanBytes_(done)+' / '+humanBytes_(total)+(rate>0?' · '+humanBytes_(rate)+'/s · about '+Math.ceil(eta/60)+' min remaining':'');
  }

  function presentationPut_(receipt,blob,start,total,onProgress) {
    return new Promise(function(resolve,reject){
      const xhr=new XMLHttpRequest();presentationState_.xhr=xhr;
      xhr.open('PUT',receipt.uploadUrl,true);xhr.timeout=10*60*1000;
      xhr.setRequestHeader('Content-Type',receipt.mime);
      xhr.setRequestHeader('Content-Range','bytes '+start+'-'+(start+blob.size-1)+'/'+total);
      xhr.upload.onprogress=function(e){if(e.lengthComputable) onProgress(start+e.loaded);};
      xhr.onload=function(){presentationState_.xhr=null;resolve({status:xhr.status,range:xhr.getResponseHeader('Range')});};
      xhr.onerror=xhr.ontimeout=function(){presentationState_.xhr=null;reject(new Error('The direct connection to Google Drive was interrupted.'));};
      xhr.onabort=function(){presentationState_.xhr=null;reject(new Error('Upload paused.'));};
      // The browser sets Content-Length. Never attach the owner's OAuth token here.
      xhr.send(blob);
    });
  }

  async function startPresentationClient_() {
    if(presentationState_.busy) return;
    const data=presentationState_.data,input=$('presFile');
    if(!data||!input)return toast_('Presentation information is still loading. Please wait or click Retry.',true);
    if(!data.uploadsEnabled)return toast_('Presentation uploads are temporarily closed. Please contact the organizers.',true);
    const file=input.files[0];
    if(!file){
      if(!data.pending&&(data.current||data.videoCurrent))return toast_('Your uploaded presentation is already submitted. Choose a new file only if you need to submit a revision.');
      input.scrollIntoView({behavior:'smooth',block:'center'});input.focus();
      return toast_(data.pending?'Select the same unchanged file to resume and complete your submission.':'Choose PowerPoint slides or a presentation video first.',true);
    }
    if(!/\.(pptx?|mp4|mov|m4v|webm|avi|mkv)$/i.test(file.name)||file.size<1||file.size>data.maxBytes) return toast_('Choose a supported PowerPoint or video file within the displayed size limit.',true);
    const presenterName=value_('presName'),presenterLastName=value_('presLastName');
    if(!presenterName||(data.track!=='Book Forum'&&!presenterLastName)) return toast_('Enter the presenter’s full name'+(data.track==='Book Forum'?'':' and family/last name')+'.',true);
    const ps=presentationState_;ps.busy=true;ps.paused=false;
    $('submitTaskButton').disabled=true;$('submitTaskButton').textContent='Uploading…';
    ['presUpload','presFile','presName','presLastName','presDiscard'].forEach(function(id){if($(id)) $(id).disabled=true;});
    $('presPause').disabled=false;$('presMessage').textContent='Preparing your file for a resumable upload…';
    let success=false;
    try {
      const fingerprint=await presentationFingerprint_(file);
      let receipt=data.pending?await gas_('resumePresentationUpload',state.token,data.pending.uploadId,fingerprint)
        :await gas_('startPresentationUpload',state.token,{originalName:file.name,size:file.size,fingerprint:fingerprint,presenterName:presenterName,presenterLastName:presenterLastName});
      ps.receipt=receipt;
      data.pending={uploadId:receipt.uploadId,originalName:file.name,size:file.size,fingerprint:fingerprint,presenterName:presenterName,presenterLastName:presenterLastName};
      let remote=receipt.completed?{complete:true,offset:file.size}:await gas_('getPresentationUploadStatus',state.token,receipt.uploadId);
      let offset=remote.offset,chunkBytes=32*1024*1024,failures=0;
      const started=performance.now(),initial=offset;
      while(!remote.complete&&offset<file.size) {
        if(ps.paused) throw new Error('Upload paused. Select the same file and click Upload / resume to continue.');
        const end=Math.min(file.size,offset+chunkBytes),chunkStarted=performance.now();
        try {
          const response=await presentationPut_(receipt,file.slice(offset,end),offset,file.size,function(done){presentationProgress_(done,file.size,started,initial);});
          if(response.status===200||response.status===201) {remote={complete:true,offset:file.size};offset=file.size;break;}
          if(response.status!==308) throw new Error('Google Drive returned HTTP '+response.status+'.');
          const match=response.range&&response.range.match(/bytes=0-(\d+)/);
          remote=match?{complete:false,offset:Number(match[1])+1}:await gas_('getPresentationUploadStatus',state.token,receipt.uploadId);
          if(remote.offset<=offset&&!remote.complete) throw new Error('No progress was confirmed by Google Drive.');
          offset=remote.offset;failures=0;
          const seconds=(performance.now()-chunkStarted)/1000;
          if(seconds<8) chunkBytes=64*1024*1024;else if(seconds>45) chunkBytes=16*1024*1024;
        } catch(error) {
          if(ps.paused) throw new Error('Upload paused. Select the same file and click Upload / resume to continue.');
          failures++;if(failures>4) throw new Error('The upload was interrupted repeatedly. Your confirmed progress is retained. Retry on a network that can connect directly to Google Drive.');
          $('presMessage').textContent='Connection interrupted. Checking saved progress and retrying ('+failures+'/4)…';
          await wait_(Math.min(8000,1000*Math.pow(2,failures-1)));
          remote=await gas_('getPresentationUploadStatus',state.token,receipt.uploadId);offset=remote.offset;
        }
        if(!Number.isSafeInteger(offset)||offset<0||offset>file.size) throw new Error('Google Drive returned an invalid upload offset.');
        presentationProgress_(offset,file.size,started,initial);
      }
      if(!remote.complete) {
        remote=await gas_('getPresentationUploadStatus',state.token,receipt.uploadId);
        if(!remote.complete) throw new Error('The upload is not complete. Click Upload / resume to continue.');
      }
      $('presMessage').textContent='Transfer complete. Verifying and filing your presentation…';
      const result=await gas_('finishPresentationUpload',state.token,receipt.uploadId);
      const task=getTask_('presentation');if(task){task.status='Uploaded';task.submittedAt=result.uploadedAt;renderPresentationShell_(task);}
      success=true;toast_('Presentation submitted successfully'+(result.late?' (marked late)':'')+'. No further Submit action is needed.');
    } catch(err) {
      if($('presMessage')) $('presMessage').textContent=friendlyError_(err);
      toast_(friendlyError_(err),true);
    } finally {
      ps.busy=false;ps.xhr=null;
      ['presUpload','presFile','presName','presLastName','presDiscard'].forEach(function(id){if($(id)) $(id).disabled=((id==='presName'||id==='presLastName')&&Boolean(data.pending))||(id==='presDiscard'&&!data.pending);});
      if($('presPause')) $('presPause').disabled=true;
      $('submitTaskButton').disabled=!data.uploadsEnabled;
      $('submitTaskButton').textContent='Submit presentation';
      if(success) await loadPresentation_();
    }
  }

  window.ACADIA = {
    openTask: openTask_, addAuthor: addAuthor_, removeAuthor: removeAuthor_,
    uploadTaskFile: uploadTaskFile_, uploadWebsiteImage: uploadWebsiteImage_,
    noteIndexingOpened: noteIndexingOpened_
  };
})();
</script>
