<style>
  :root{

  .banner-fallback strong{font-size:clamp(31px,5vw,58px);letter-spacing:-.055em}.banner-fallback span{font-size:11px;color:#ded8cf}
  .deadline-bar{position:sticky;top:0;z-index:40;padding:10px 18px;text-align:center;background:var(--amber-bg);border-bottom:1px solid #ddc08a;color:#5d3e0b;font-size:10px;font-weight:900}
  .deadline-bar.closed{background:var(--red-bg);border-color:#dfb5af;color:var(--red)}
  .shell{max-width:var(--page);margin:auto;padding:27px 20px 65px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .home-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:21px}.home-intro,.login-card{padding:34px}

  h1,h2,h3,h4{letter-spacing:-.035em}.home-intro h1{font-size:clamp(38px,5.3vw,67px);line-height:.95;letter-spacing:-.06em;margin:0 0 18px}.home-intro>p{font-size:15px;color:#514e47;max-width:730px;margin:0}

  .login-card{display:flex;flex-direction:column;justify-content:center}.login-card h2{font-size:26px;margin:0 0 6px}.login-card p{font-size:10.5px;color:var(--muted);margin:0 0 18px}

  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;outline:none;color:var(--ink)} textarea{min-height:112px;resize:vertical}

  input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,83,61,.12)}

  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover:not(:disabled){background:#d74633}.btn-secondary{background:#fff;border-color:var(--line)}.btn-quiet{background:transparent;color:var(--accent-dark);padding-left:0}.btn-danger{background:var(--red);color:#fff}.btn-small{padding:7px 9px;font-size:8.5px}.button-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .error-box,.notice-box{display:none;margin-top:11px;padding:10px 12px;border-radius:9px;font-size:9.5px}.error-box{background:var(--red-bg);color:var(--red)}.notice-box{background:var(--green-bg);color:var(--green)}
  .portal-header{padding:24px 27px;display:flex;justify-content:space-between;gap:22px;align-items:flex-start}.portal-header h2{font-size:29px;line-height:1.08;margin:3px 0 7px}.meta{font-size:9.5px;color:var(--muted)}
  .status{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;font-size:8.5px;font-weight:950;white-space:nowrap}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}.status-open{background:var(--amber-bg);color:var(--amber)}.status-review{background:var(--blue-bg);color:var(--blue)}.status-good{background:var(--green-bg);color:var(--green)}.status-action{background:var(--red-bg);color:var(--red)}
  .portal-grid{display:grid;grid-template-columns:1.58fr .82fr;gap:20px;margin-top:20px}.panel{padding:23px}.panel h3{font-size:20px;margin:0 0 5px}.panel-intro{font-size:9.5px;color:var(--muted);margin:0 0 16px}
  .progress-line{display:flex;justify-content:space-between;gap:14px;align-items:flex-end}.progress-line strong{font-size:25px}.progress-line span{font-size:8.5px;color:var(--muted)}.progress{height:10px;border-radius:99px;background:#ddd8cf;overflow:hidden;margin-top:8px}.progress div{height:100%;background:var(--accent);width:0;transition:.3s}

  .task-card{display:grid;grid-template-columns:45px 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.task-number{width:45px;height:45px;border-radius:12px;background:#efebe4;display:grid;place-items:center;font-size:16px;font-weight:950}.task-card h4{font-size:13px;margin:0 0 3px}.task-card p{font-size:9px;color:var(--muted);margin:0}.task-actions{display:flex;align-items:center;gap:7px}
  .pill{padding:5px 8px;border-radius:999px;font-size:7.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:950;white-space:nowrap}.pill-not{background:#efebe4;color:#5d5951}.pill-draft{background:var(--amber-bg);color:var(--amber)}.pill-submitted{background:var(--blue-bg);color:var(--blue)}.pill-approved{background:var(--green-bg);color:var(--green)}.pill-action{background:var(--red-bg);color:var(--red)}.pill-ready{background:var(--violet-bg);color:var(--violet)}
  .side-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat small{display:block;font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:15px;margin-top:4px}
  .activity{display:grid;gap:10px}.event{display:grid;grid-template-columns:8px 1fr;gap:9px}.event-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:3px}.event strong{display:block;font-size:9.5px}.event span{display:block;font-size:8.3px;color:var(--muted)}
  .rule-note{margin-top:15px;border-left:4px solid var(--accent);background:#fff2ef;border-radius:0 10px 10px 0;padding:11px 13px;color:#604039;font-size:9.2px}
  .task-layout{display:grid;grid-template-columns:1fr 275px;gap:20px}.task-main{padding:27px}.task-side{padding:20px;align-self:start;position:sticky;top:55px}.back{margin-bottom:14px}.task-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.task-title-row h2{font-size:30px;line-height:1.05;margin:0 0 7px}.task-subtitle{font-size:10.5px;color:var(--muted);margin:0 0 21px}
  .content-box{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff;margin-bottom:13px}.content-box h3{font-size:15px;margin:0 0 8px}.content-box p,.content-box li{font-size:9.5px;color:#504c45}.content-box ol,.content-box ul{padding-left:20px}

  .attendance-faq>p{margin-bottom:13px}.faq-list{display:grid;gap:8px}.faq-item{border:1px solid var(--line);border-radius:11px;background:#faf8f3;overflow:hidden}.faq-item summary{position:relative;list-style:none;cursor:pointer;padding:12px 42px 12px 13px;font-size:10px;font-weight:900;line-height:1.35}.faq-item summary::-webkit-details-marker{display:none}.faq-item summary:after{content:"+";position:absolute;right:13px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--accent-dark);font-size:15px}.faq-item[open] summary{background:#fff}.faq-item[open] summary:after{content:"−"}.faq-answer{padding:0 13px 13px;border-top:1px solid var(--line);background:#fff}.faq-answer p{margin:11px 0 0}.faq-answer a,.remote-policy a{color:var(--accent-dark);font-weight:850}.venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.venue-card{display:flex;flex-direction:column;gap:3px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#faf8f3;font-size:9px}.venue-card strong{font-size:9.5px;margin-bottom:3px}.venue-card code{margin-top:5px;font-size:8px;color:var(--muted);white-space:normal}.remote-policy{border-color:#e4b3aa;background:#fff9f7}.policy-heading{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:8px}.policy-heading h3{margin:0}.policy-badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--red-bg);color:var(--red);font-size:7.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:950;white-space:nowrap}.policy-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.policy-block{padding:12px;border:1px solid #ead1cc;border-radius:10px;background:#fff}.policy-block h4{font-size:10px;margin:0 0 5px}.policy-block p{margin:0}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

  .image-row{display:grid;grid-template-columns:68px 1fr 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#faf8f3;margin-bottom:8px}.image-slot{width:54px;height:54px;border-radius:10px;background:#ece8e0;display:grid;place-items:center;font-weight:950}.image-fields{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.image-fields input{font-size:9px;padding:8px}
  .download-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.download-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#faf8f3}.download-card strong{display:block;font-size:10.5px;margin-bottom:4px}.download-card span{display:block;font-size:8.5px;color:var(--muted);margin-bottom:10px}

  .upload-progress{height:9px;border-radius:99px;background:#ddd8cf;overflow:hidden;margin-top:10px}.upload-progress div{height:100%;background:var(--accent);width:0;transition:.15s}.upload-message{font-size:8.5px;color:var(--muted);margin-top:6px}
  .actions-card{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}.actions-card h3{font-size:14px;margin:0 0 5px}.actions-card p{font-size:9px;color:var(--muted);margin:0 0 13px}.last-save{font-size:8px;color:var(--muted);margin-top:9px}
  .counter{text-align:right;font-size:8px;color:var(--muted);margin-top:3px}.counter.over{color:var(--red);font-weight:900}
  .proof-viewer{height:650px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#282724}.proof-viewer iframe{width:100%;height:100%;border:0}.proof-comment{display:grid;grid-template-columns:92px 150px 1fr 37px;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#faf8f3;margin-bottom:8px}.proof-comment input,.proof-comment select,.proof-comment textarea{font-size:9px;padding:8px;min-height:38px}.proof-comment textarea{min-height:66px}.proof-help{font-size:9px;color:var(--muted)}
  .external-transition{position:fixed;inset:0;z-index:100;background:rgba(20,20,19,.94);color:#fff;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}.external-transition.active{display:flex}.transition-card{max-width:520px}.transition-mark{width:60px;height:60px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin:0 auto 18px;font-size:25px;font-weight:950}.transition-card h2{font-size:28px;margin:0 0 8px}.transition-card p{font-size:11px;color:#ddd8cf}
  .loading{position:fixed;inset:0;z-index:120;background:rgba(239,237,232,.78);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center}.loading.active{display:flex}.spinner{width:38px;height:38px;border:4px solid #d8d2c8;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:620px){.shell{padding:18px 12px 50px}.home-intro,.login-card,.panel,.task-main,.task-side{padding:19px}.facts,.two-col{grid-template-columns:1fr}.portal-header{flex-direction:column}.image-row,.proof-comment,.author-row{grid-template-columns:1fr}.image-fields{grid-column:1;grid-template-columns:1fr}.task-actions{grid-column:1/-1}.proof-viewer{height:480px}}

  /* =========================================================
     READABILITY TYPOGRAPHY OVERRIDE
     Edit only these variables later to tune the whole portal.
     This block changes text sizes without scaling cards,
     buttons, images, spacing, or the page width.
     ========================================================= */
  :root{
    --type-micro:9.5px;
    --type-xs:10.5px;
    --type-sm:11.5px;
    --type-body:12.5px;
    --type-label:12px;
    --type-control:13px;
    --type-card-title:15px;
    --type-section-title:17px;
    --type-meta:11.5px;
  }

  .deadline-bar{font-size:var(--type-sm)}
  .eyebrow{font-size:var(--type-xs)}
  .banner-fallback span{font-size:var(--type-body)}

  .fact small,
  .stat small{font-size:var(--type-micro)}
  .fact strong{font-size:var(--type-body)}
  .stat strong{font-size:17px}

  .login-card p,
  .panel-intro,
  .task-subtitle,
  .meta{font-size:var(--type-meta)}

  .field label{font-size:var(--type-label)}
  .hint,
  .counter,
  .last-save{font-size:var(--type-xs)}

  .readonly-value,
  .author-row input,
  .author-row select,
  .image-fields input,
  .proof-comment input,
  .proof-comment select,
  .proof-comment textarea,
  .upload-zone input{font-size:var(--type-control)}

  .btn{font-size:var(--type-sm)}
  .btn-small{font-size:var(--type-xs)}

  .error-box,
  .notice-box,
  .toast{font-size:var(--type-sm)}

  .status,
  .pill{font-size:var(--type-micro)}

  .progress-line span,
  .section-label{font-size:var(--type-xs)}
  .todo,
  .rule-note{font-size:var(--type-sm)}

  .task-card h4{font-size:var(--type-card-title)}
  .task-card p{font-size:var(--type-sm);line-height:1.45}

  .event strong{font-size:var(--type-sm)}
  .event span{font-size:var(--type-xs)}

  .content-box h3{font-size:var(--type-section-title)}
  .content-box p,
  .content-box li{font-size:var(--type-body);line-height:1.58}

  .review-card strong{font-size:var(--type-body)}
  .review-card p{font-size:var(--type-body);line-height:1.58}

  .faq-item summary{font-size:var(--type-body)}
  .venue-card{font-size:var(--type-sm)}
  .venue-card strong{font-size:var(--type-body)}
  .venue-card code{font-size:var(--type-xs)}
  .policy-badge{font-size:var(--type-micro)}
  .policy-block h4{font-size:var(--type-body)}

  .download-card strong{font-size:var(--type-body)}
  .download-card span{font-size:var(--type-sm)}
  .file-chip,
  .upload-message,
  .proof-help{font-size:var(--type-xs)}

  .actions-card h3{font-size:var(--type-card-title)}
  .actions-card p{font-size:var(--type-sm)}

  .transition-card p{font-size:var(--type-body)}
  .footer{font-size:var(--type-xs)}

  @media(max-width:620px){
    :root{
      --type-micro:10px;
      --type-xs:11px;
      --type-sm:12px;
      --type-body:13px;
      --type-label:12.5px;
      --type-control:16px;
      --type-card-title:15.5px;
      --type-section-title:17px;
      --type-meta:12px;
    }
  }


  /* Two-line deadline bar and Task 5 attendance confirmation. */
  .deadline-main{font-weight:950;line-height:1.35}
  .deadline-extra{margin-top:4px;font-size:.95em;font-weight:650;line-height:1.4}
  .attendance-confirmation{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1px solid #e1c18c;border-radius:11px;background:#fff6e6;font-size:var(--type-body,12.5px);font-weight:700;line-height:1.5}
  .attendance-confirmation input{width:auto;flex:0 0 auto;margin-top:3px}
  .attendance-confirmation span{display:block}


  /* International-author visa invitation card and request modal. */
  .visa-letter-card{border-top:4px solid var(--accent)}
  .visa-letter-card h3{margin-top:0}
  .visa-letter-disclaimer{margin:12px 0 0;color:var(--muted);font-size:var(--type-xs,10.5px);line-height:1.45}
  .visa-modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(20,20,19,.72);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
  .visa-modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.28);padding:24px}
  .visa-modal-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:10px}
  .visa-modal-header h2{font-size:26px;line-height:1.08;margin:0}
  .visa-modal-card>p{font-size:var(--type-body,12.5px);color:var(--muted);margin:0 0 18px}
  .visa-modal-close{width:38px;height:38px;flex:0 0 38px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-size:22px;line-height:1;display:grid;place-items:center}
  .visa-modal-actions{justify-content:flex-end;margin-top:17px}
  body.modal-open{overflow:hidden}
  @media(max-width:620px){
    .visa-modal-overlay{padding:10px}
    .visa-modal-card{padding:19px;border-radius:15px}
    .visa-modal-actions{justify-content:stretch}
    .visa-modal-actions .btn{flex:1}
  }


  /* Public conference program below both landing-page cards. */
  .public-program-card{grid-column:1/-1;min-width:0;overflow:hidden}
  .public-program-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 28px;border-bottom:1px solid var(--line)}
  .public-program-heading h2{margin:0 0 6px;font-size:26px;font-weight:400;line-height:1.2}
